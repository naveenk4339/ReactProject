server.port=8080
spring.datasource.url=jdbc:h2:mem:carshop;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Sales tax applied to every bill (8%)
carshop.tax-rate=0.08
# Flat documentation/registration fee per car
carshop.doc-fee=499.00
